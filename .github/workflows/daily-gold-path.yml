name: Daily Gold Path — 2 AM Report

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 2:00 AM Athens (UTC+3)
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  gold-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run gold path tests (JSON output)
        id: run_tests
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results.json npx playwright test \
            tests/e2e/auth.spec.ts \
            tests/e2e/onboarding-beginner.spec.ts \
            tests/e2e/week-navigation.spec.ts \
            tests/e2e/weekly-review.spec.ts \
            tests/e2e/activity-feedback.spec.ts \
            tests/e2e/smoke-gemini.spec.ts \
            --reporter=json 2>/dev/null || true

      - name: Build email report and set outputs
        id: report
        run: |
          # Write the report builder to a temp file (avoids all shell-escaping issues)
          cat > /tmp/build-report.js << 'ENDSCRIPT'
          const fs = require('fs');

          const date = new Date().toLocaleDateString('en-GB', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
            timeZone: 'Europe/Athens',
          });
          const repo    = process.env.GITHUB_REPOSITORY;
          const runId   = process.env.GITHUB_RUN_ID;
          const outFile = process.env.GITHUB_OUTPUT;
          const runUrl  = `Run details: https://github.com/${repo}/actions/runs/${runId}`;

          function writeOutputs(subject, body) {
            fs.appendFileSync(outFile, `subject=${subject}\n`);
            fs.appendFileSync(outFile, `body<<DROMOS_EMAIL_DELIM\n${body}\nDROMOS_EMAIL_DELIM\n`);
          }

          try {
            if (!fs.existsSync('test-results.json')) {
              throw new Error('test-results.json not found — Playwright may have failed to start');
            }

            const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const allTests = results.suites.flatMap(s => s.specs).flatMap(s => s.tests);
            const passed = allTests.filter(t => t.status === 'expected').length;
            const failed = allTests.filter(t => t.status !== 'expected').length;
            const total  = passed + failed;

            const failedNames = results.suites
              .flatMap(s => s.specs.map(spec => ({ title: spec.title, tests: spec.tests })))
              .flatMap(({ title, tests }) => tests.filter(t => t.status !== 'expected').map(() => '  • ' + title))
              .join('\n');

            const emoji  = failed === 0 ? '✅' : '❌';
            const status = failed === 0 ? 'ALL PASSING' : `${failed} FAILING`;
            const detail = failed > 0 ? `Failed tests:\n${failedNames}` : 'All critical flows are working perfectly.';

            const body = [
              `${emoji} Dromos — Daily Gold Path Report`,
              date, '',
              `Status: ${status}`,
              `Passed: ${passed} / ${total}`, '',
              detail, '',
              runUrl,
            ].join('\n');

            const subject = failed === 0
              ? 'Dromos daily report — All good ✅'
              : `Dromos daily report — ${failed} test(s) failing ❌`;

            writeOutputs(subject, body);
            console.log(body);
          } catch (err) {
            const body = [
              '⚠️ Dromos — Daily Gold Path Report',
              date, '',
              'Status: REPORT ERROR', '',
              `Could not parse test results: ${err.message}`, '',
              runUrl,
            ].join('\n');
            writeOutputs('Dromos daily report — report error ⚠️', body);
            console.error('Report build failed:', err.message);
          }
          ENDSCRIPT
          node /tmp/build-report.js

      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.report.outputs.subject }}
          to: george.zim83@gmail.com
          from: Dromos Tests <${{ secrets.GMAIL_SENDER_ADDRESS }}>
          body: ${{ steps.report.outputs.body }}

      - name: Upload full report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-path-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
